name: satys

x-satys-common: &satys-common
  image: ${SATYS_IMAGE:-satys-api:2026.08.28-definitiva-cierre-seguro-rpc-publico-manual-correos-remitentes-email-post1}
  build:
    context: .
    args:
      PLAYWRIGHT_VERSION: "1.57.0"
      SATYS_VERSION: "2026.08.28-definitiva-cierre-seguro-rpc-publico-manual-correos-remitentes-email-post1"
      SATYS_GIT_COMMIT: ${SATYS_GIT_COMMIT:-unknown}
  environment:
    TZ: ${SATYS_TZ:-America/Mexico_City}
    HOME: /tmp
    SATYS_PYTHON: /opt/satys-venv/bin/python
    SATYS_HEADLESS: "1"
    SATYS_INTERNOS_WORKERS: "${SATYS_INTERNOS_WORKERS:-12}"
    SATYS_INTERNOS_WORKER_REINTENTOS: "${SATYS_INTERNOS_WORKER_REINTENTOS:-2}"
    SATYS_INTERNOS_WORKER_ESPERA: "${SATYS_INTERNOS_WORKER_ESPERA:-2}"
    SATYS_ZIP_MAX_ITERACIONES: "${SATYS_ZIP_MAX_ITERACIONES:-32}"
    SATYS_ZIP_RUTA_RELATIVA_MAX: "${SATYS_ZIP_RUTA_RELATIVA_MAX:-140}"
    SATYS_RECONCILIACION_GLOBAL_TIMEOUT: "${SATYS_RECONCILIACION_GLOBAL_TIMEOUT:-1800}"
    SATYS_SIN_OPERADOR_RPC_PUBLICO_TIMEOUT: "${SATYS_SIN_OPERADOR_RPC_PUBLICO_TIMEOUT:-1800}"
    SATYS_API_ALLOW_MANUAL: "1"
    SATYS_API_ALLOW_REPAIR: "1"
    SATYS_API_ALLOW_START: "0"
    SATYS_API_ALLOW_TIMER_EDIT: "0"
    SATYS_LOCK_DIR: /locks
    SATYS_DAILY_GUARD_DIR: /app/runs/daily_guard
    SATYS_SHARED_DIR: /shared
    SATYS_SESION_FILE: /runtime/sesion_guardada.json
    SATYS_REQUIRE_SHARED_MOUNT: "0"
  volumes:
    - ${SATYS_CONFIG_HOST_FILE:-./config/configuracion_local.json}:/app/config/configuracion_local.json:ro
    - ${SATYS_RUNTIME_DIR:-./runtime}:/runtime
    - ${SATYS_RUNTIME_DIR:-./runtime}/TrámitesCRT.xlsx:/app/TrámitesCRT.xlsx
    - ${SATYS_RUNTIME_DIR:-./runtime}/descargas:/app/descargas
    - ${SATYS_RUNTIME_DIR:-./runtime}/output:/app/output
    - ${SATYS_RUNTIME_DIR:-./runtime}/logs:/app/logs
    - ${SATYS_RUNTIME_DIR:-./runtime}/runs:/app/runs
    - ${SATYS_RUNTIME_DIR:-./runtime}/exports:/app/exports
    - ${SATYS_RUNTIME_DIR:-./runtime}/base_de_datos_rpc:/app/base_de_datos_rpc
    - ${SATYS_RUNTIME_DIR:-./runtime}/registros_diarios:/app/registros_diarios
    - ${SATYS_RUNTIME_DIR:-./runtime}/registros_fallidos:/app/registros_fallidos
    - ${SATYS_SHARED_HOST_DIR:-./runtime/shared}:/shared
    - ${SATYS_LOCK_HOST_DIR:-./runtime/locks}:/locks
  shm_size: "${SATYS_SHM_SIZE:-6gb}"
  init: true
  user: "${SATYS_UID:-10001}:${SATYS_GID:-10001}"

services:
  satys-api:
    <<: *satys-common
    restart: unless-stopped
    ports:
      - "${SATYS_API_BIND:-127.0.0.1}:${SATYS_API_PORT:-8082}:8082"
    command: ["uvicorn", "satys_api:app", "--host", "0.0.0.0", "--port", "8082", "--proxy-headers"]

  satys-worker:
    <<: *satys-common
    profiles: ["worker"]
    restart: "no"
    command: ["python", "automatizar_registros_diario.py", "--headless", "--workers", "10"]
