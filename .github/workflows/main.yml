# .github/workflows/automatizar_registros.yml
name: Automatizar Registros CRT
on:
  schedule:
    - cron: '0 8 * * *'   # 8:00 AM UTC, ajustar a tu zona horaria
  workflow_dispatch:        # permite correrlo manualmente también

jobs:
  actualizar:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar script
        run: python automatizar_registros_diario.py
