name: SATyS CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quality tools and dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Unit tests
        run: SATYS_CONFIG_FILE=config/configuracion_local.example.json python -m unittest discover tests/
      - name: Daily-run guard test
        run: bash tests/test_ejecucion_diaria_unica.sh

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: |
          docker build \
            --build-arg SATYS_VERSION="$(cat VERSION)" \
            --build-arg SATYS_GIT_COMMIT="$GITHUB_SHA" \
            -t satys-ci:"$GITHUB_SHA" .
      - name: Run unit tests inside image
        run: docker run --rm -e SATYS_CONFIG_FILE=/app/config/configuracion_local.example.json --entrypoint python satys-ci:"$GITHUB_SHA" -m unittest discover tests/
      - name: Validate release packager inside image
        run: docker run --rm --entrypoint python satys-ci:"$GITHUB_SHA" scripts/preparar_release.py --output-dir /tmp/releases
