# Ejemplo de reverse proxy TLS para SATyS CRT.
# Ajustar server_name y rutas de certificados a la infraestructura de la CRT.

server {
    listen 80;
    server_name satys.ejemplo.interno;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name satys.ejemplo.interno;

    ssl_certificate     /etc/pki/tls/certs/satys.crt.pem;
    ssl_certificate_key /etc/pki/tls/private/satys.crt.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
