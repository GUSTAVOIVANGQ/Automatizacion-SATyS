[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "base_de_datos_rpc",
  "debug",
  "descargas",
  "exports",
  "logs",
  "output",
  "registros_diarios",
  "releases",
  "runs",
  "Screenshots",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
